<path class="arrow" d="M80 220H343" marker-end="url(#arrow)"/>
<text class="note" x="480" y="279" text-anchor="middle">Fresh credentials</text>
<path class="arrow" d="M615 290H347" marker-end="url(#arrow)"/>
<text class="note" x="210" y="339" text-anchor="middle">Replay once per operation</text>
