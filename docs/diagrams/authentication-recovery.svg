<rect class="step" x="5" y="5" width="150" height="44" rx="6"/>
<text class="label" x="80.0" y="30" text-anchor="middle">Requests</text>
<path class="arrow" stroke-dasharray="4 5" d="M80.0 49V389"/>
<rect class="step" x="245" y="5" width="200" height="44" rx="6"/>
<text class="label" x="345.0" y="30" text-anchor="middle">Authentication</text>
<path class="arrow" stroke-dasharray="4 5" d="M345.0 49V389"/>
<rect class="step" x="535" y="5" width="160" height="44" rx="6"/>
<text class="label" x="615.0" y="30" text-anchor="middle">Your sign-in</text>
<path class="arrow" stroke-dasharray="4 5" d="M615.0 49V389"/>
<text class="note" x="207" y="89" text-anchor="middle">401 challenges</text>
<path class="arrow" d="M80 100H343" marker-end="url(#arrow)"/>
<text class="note" x="480" y="139" text-anchor="middle">One recovery</text>
<path class="arrow" d="M345 150H613" marker-end="url(#arrow)"/>
