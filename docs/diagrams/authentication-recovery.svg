<rect class="panel" x="5" y="400" width="690" height="84" rx="6"/>
<text class="label" x="350.0" y="425" text-anchor="middle">Replay policy comes first</text>
<text class="note" x="350.0" y="445" text-anchor="middle">GET is eligible by default; blocked writes fail before opening sign-in.</text>
<text class="note" x="350.0" y="465" text-anchor="middle">403 is access denied, not a recovery trigger.</text>
