name: Publish packages and website
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Commit-derived release channel'
        default: preview
        type: choice
        options: [preview, stable]
      dry_run:
        description: 'Build and validate without publishing'
        default: true
        type: boolean
      deploy_site:
        description: 'Deploy the checked website after npm publication'
        default: true
        type: boolean
      site_only:
        description: 'Website only: run on a release/* branch from the released commit; no npm publication'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  build:
    # A package release runs from main. A website-only run comes from a release/*
    # branch whose package sources match the released commit (scripts/site-only.ts).
    if: github.repository == 'GetAster/aster-ui' && ((!inputs.site_only && github.ref == 'refs/heads/main') || (inputs.site_only && startsWith(github.ref, 'refs/heads/release/')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version || steps.site-only.outputs.version }}
      package_revision: ${{ steps.site-only.outputs.package_revision || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Derive release version
        if: '!inputs.site_only'
        id: version
        run: node scripts/version.ts --channel "$RELEASE_CHANNEL" --build "$GITHUB_RUN_NUMBER" | sed 's/^/version=/' >> "$GITHUB_OUTPUT"
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
      - name: Check the website-only branch against the released packages
        if: inputs.site_only
        id: site-only
        run: bun scripts/site-only.ts >> "$GITHUB_OUTPUT"
      - run: bash scripts/scan-dependencies.sh
      - name: Retain dependency scan and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-reports
          path: dist-security/
          retention-days: 7
          if-no-files-found: warn
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run verify:wasm
      - run: bun run typecheck
      - run: bun run check:deps
      - run: bun run docs:package
      - name: Check versioning and publication paths
        run: bun test ./packages/docs ./tests/integration/version.test.ts ./tests/integration/agent-docs.test.ts ./tests/integration/product-site.test.ts ./tests/integration/release-notes.test.ts
      - name: Check the changelog has notes for this release
        if: "!inputs.site_only && inputs.channel == 'stable'"
        run: node scripts/release-notes.ts "$RELEASE_VERSION" > /dev/null
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
      - name: Build release tarballs
        if: '!inputs.site_only'
        run: bun run packages:build --version "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
      - if: '!inputs.site_only'
        run: bun scripts/check-package-consumer.ts
      - if: '!inputs.site_only'
        run: bun scripts/check-template-consumer.ts
      - name: Build the matching release website
        run: bun run site:release --version "$RELEASE_VERSION" --revision "$GITHUB_SHA" --package-revision "$PACKAGE_REVISION"
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version || steps.site-only.outputs.version }}
          PACKAGE_REVISION: ${{ steps.site-only.outputs.package_revision || github.sha }}
      - name: Upload checked website
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-site
          path: dist-site/
          retention-days: 7
          if-no-files-found: error
      - name: Upload checked packages
        if: '!inputs.site_only'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release
          path: dist-release/
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: build
    if: '!inputs.site_only'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release
          path: dist-release/
      - name: Check npm OIDC support
        run: node -e 'const v = require("node:child_process").execFileSync("npm", ["--version"], {encoding:"utf8"}).trim().split(".").map(Number); if (v[0] < 11 || (v[0] === 11 && (v[1] < 5 || (v[1] === 5 && v[2] < 1)))) throw new Error("npm 11.5.1+ required")'
      - name: Show publication plan
        if: inputs.dry_run
        run: node scripts/publish-packages.mjs --dry-run
      - name: Publish using npm OIDC
        if: '!inputs.dry_run'
        run: node scripts/publish-packages.mjs
      - name: Verify registry publication and tarball integrity
        if: '!inputs.dry_run'
        run: node scripts/verify-package-registry.mjs

  github-release:
    needs: [build, publish]
    # A stable release gets a tag and a GitHub release whose notes are its CHANGELOG.md section.
    if: ${{ needs.publish.result == 'success' && !inputs.dry_run && inputs.channel == 'stable' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Create the GitHub release
        run: |
          if gh release view "v$RELEASE_VERSION" > /dev/null 2>&1; then
            echo "v$RELEASE_VERSION already has a release"
            exit 0
          fi
          node scripts/release-notes.ts "$RELEASE_VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$RELEASE_VERSION" --target "$GITHUB_SHA" --title "Aster UI $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}

  deploy-site:
    needs: [build, publish]
    # A website-only run skips publish; a package release deploys only after it succeeds.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.publish.result == 'success' || (inputs.site_only && needs.publish.result == 'skipped')) && !inputs.dry_run && inputs.deploy_site }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ui-site
    permissions:
      contents: read
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ui-site
          path: dist-site/
      - name: Check release identity
        run: node --input-type=module -e 'import fs from "node:fs"; const r = JSON.parse(fs.readFileSync("dist-site/deployment.json")); if (r.version !== process.env.RELEASE_VERSION || r.revision !== process.env.GITHUB_SHA || r.packageRevision !== process.env.PACKAGE_REVISION) throw new Error("Site release identity mismatch")'
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          PACKAGE_REVISION: ${{ needs.build.outputs.package_revision }}
      - run: npm ci --prefix scripts/cloudflare --ignore-scripts --no-audit --no-fund
      - run: node scripts/prepare-cloudflare.mjs
      - run: scripts/cloudflare/node_modules/.bin/cf deploy --prebuilt --dry-run
      - name: Deploy checked static assets
        run: scripts/cloudflare/node_modules/.bin/cf deploy --prebuilt --tag "$RELEASE_VERSION" --message "$GITHUB_SHA"
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
