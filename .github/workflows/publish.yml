name: Publish packages and website
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Commit-derived release channel'
        default: preview
        type: choice
        options: [preview, stable]
      dry_run:
        description: 'Build and validate without publishing'
        default: true
        type: boolean
      deploy_site:
        description: 'Deploy the checked website after npm publication'
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'GetAster/aster-ui' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Derive release version
        id: version
        run: node scripts/version.ts --channel "$RELEASE_CHANNEL" --build "$GITHUB_RUN_NUMBER" | sed 's/^/version=/' >> "$GITHUB_OUTPUT"
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
      - run: bash scripts/scan-dependencies.sh
      - name: Retain dependency scan and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-reports
          path: dist-security/
          retention-days: 7
          if-no-files-found: warn
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run verify:wasm
      - run: bun run typecheck
      - run: bun run check:deps
      - name: Check versioning and publication paths
        run: bun test ./tests/integration/version.test.ts ./tests/integration/agent-docs.test.ts ./tests/integration/product-site.test.ts
      - name: Build release tarballs
        run: bun run packages:build --version "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
      - run: bun scripts/check-package-consumer.ts
      - name: Build the matching release website
        run: bun run site:release --version "$RELEASE_VERSION" --revision "$GITHUB_SHA"
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
      - name: Upload checked website
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-site
          path: dist-site/
          retention-days: 7
          if-no-files-found: error
      - name: Upload checked packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release
          path: dist-release/
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release
          path: dist-release/
      - name: Check npm OIDC support
        run: node -e 'const v = require("node:child_process").execFileSync("npm", ["--version"], {encoding:"utf8"}).trim().split(".").map(Number); if (v[0] < 11 || (v[0] === 11 && (v[1] < 5 || (v[1] === 5 && v[2] < 1)))) throw new Error("npm 11.5.1+ required")'
      - name: Show publication plan
        if: inputs.dry_run
        run: node scripts/publish-packages.mjs --dry-run
      - name: Publish using npm OIDC
        if: '!inputs.dry_run'
        run: node scripts/publish-packages.mjs
      - name: Verify registry publication and tarball integrity
        if: '!inputs.dry_run'
        run: node scripts/verify-package-registry.mjs

  deploy-site:
    needs: [build, publish]
    if: ${{ !inputs.dry_run && inputs.deploy_site }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ui-site
    permissions:
      contents: read
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ui-site
          path: dist-site/
      - name: Check release identity
        run: node --input-type=module -e 'import fs from "node:fs"; const r = JSON.parse(fs.readFileSync("dist-site/deployment.json")); if (r.version !== process.env.RELEASE_VERSION || r.revision !== process.env.GITHUB_SHA) throw new Error("Site release identity mismatch")'
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
      - run: npm ci --prefix scripts/cloudflare --ignore-scripts --no-audit --no-fund
      - run: node scripts/prepare-cloudflare.mjs
      - run: scripts/cloudflare/node_modules/.bin/cf deploy --prebuilt --dry-run
      - name: Deploy checked static assets
        run: scripts/cloudflare/node_modules/.bin/cf deploy --prebuilt --tag "$RELEASE_VERSION" --message "$GITHUB_SHA"
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
